[project]
name = "spatialeconometrics-hw1"
version = "0.1.0"
description = "Подготовка данных для исследования пространственных эффектов в выручке магазинов сети «Пятерочка» по локальным рынкам России"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "rapidfuzz>=3.14.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
